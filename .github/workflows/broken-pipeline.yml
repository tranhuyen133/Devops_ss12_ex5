name: Broken Pipeline (Fixed)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # --- FIX Lỗi 1: cấp quyền thực thi cho gradlew ---
      - name: Cấp quyền cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build jar
        run: ./gradlew bootJar

      # --- FIX Lỗi 2: đúng tên secret REGISTRY_TOKEN ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # --- FIX Lỗi 3: khai báo đúng context và file Dockerfile ---
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/my-app:latest
